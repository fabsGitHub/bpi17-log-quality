[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpi17-log-quality"
version = "0.1.0"
description = "A reproducible process-mining workflow for event-log quality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pm4py>=2.7,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
bpi17-quality = "bpi17_log_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

